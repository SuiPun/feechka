<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff0fa"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Феечка"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Феечка</title>
<style>
:root{--bg:#fff4fb;--panel:#ffffff;--line:#f0d2ee;--txt:#3b2a63;--dim:#7a6a9f;--am:#8a5cf0;--pink:#ff4fb0;--ice:#12a6c9;--form:#0e9f7b;--red:#e2455f;--yel:#c98600;--grn:#1fa876}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#fff0fa 0%,#f1ecff 50%,#e6fbff 100%) fixed;color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 88px}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2,h3{margin:.2em 0 .5em;font-weight:700;letter-spacing:.02em}
h1{font-size:1.35rem;text-transform:uppercase;background:linear-gradient(90deg,var(--pink),var(--am),var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.1rem;color:var(--am)}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.85em;color:var(--dim);letter-spacing:.05em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 14px;box-shadow:0 2px 12px #c9a8f01f}
.neon{box-shadow:0 0 0 1px #ff4fb040,0 6px 24px #b48cff33}
.quote{border-left:3px solid var(--am);padding:6px 10px;margin:10px 0;color:#4b3a78;font-style:italic;background:#faf5ff;border-radius:0 10px 10px 0}
.quote b{font-style:normal;color:var(--am)}
.quote.l{border-color:#19c3e6;background:#effbff}.quote.l b{color:#0e8fb0}
label{display:block;margin:12px 0 4px;font-weight:600}
.opt{font-style:italic;font-weight:300;font-size:.88em;color:#8a7aa8}
input[type=text],input[type=number],textarea,select{width:100%;background:#fff;border:1px solid #e6c9ec;border-radius:12px;color:var(--txt);padding:10px;font:inherit}
textarea{min-height:76px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--am)}
.range{display:flex;gap:10px;align-items:center}.range output{min-width:2.2em;text-align:center;font-weight:700;color:var(--pink);font-size:1.2rem}
.hint{font-size:.85rem;color:var(--dim);margin:2px 0}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:8px 0}
.chk input{width:20px;height:20px;accent-color:var(--pink);flex:none}
button{font:inherit;cursor:pointer;border-radius:14px;border:1px solid #e6c9ec;background:#fff;color:var(--txt);padding:12px 14px;min-height:44px}
button.pri{background:linear-gradient(90deg,#8a5cf0,#ff4fb0);border:0;font-weight:700;width:100%;margin-top:14px;color:#fff;box-shadow:0 4px 14px #ff4fb055}
button.ghost{background:none;color:var(--dim);border-color:transparent}
button.sel{border-color:var(--pink);color:var(--pink);font-weight:700;background:#fff0f9}
button.danger{border-color:var(--red);color:var(--red);background:#fff}
button.sos{width:100%;margin:0 0 14px;border-color:var(--pink);background:#fff0f9;font-weight:700;color:#c92c8a}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>button{flex:1}
.task{display:flex;align-items:center;gap:6px;margin:0 0 8px}
.task .ti{font-size:1.35rem;width:1.8rem;text-align:center;flex:none}
.task .n{flex:1;min-width:0;overflow-wrap:anywhere}.task .c{font-size:.8rem;color:var(--dim)}
.task .sb{flex:none;width:44px;padding:0;font-size:1.05rem}
.blu{color:#0e8fb0}.grn{color:var(--grn)}.yel{color:var(--yel)}.red{color:var(--red)}
.top{display:flex;gap:14px;align-items:center}
.jar{width:110px;flex:none}
.bar{height:8px;background:#f1e6fb;border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#19c3e6,#8a5cf0,#ff4fb0)}
.month{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.month span{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:.7rem;color:var(--dim);background:#fff}
.month .on{background:#8a5cf022;border-color:var(--am);color:var(--txt)}.month .now{outline:2px solid var(--pink)}
.spark{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:8px}
.spark i{flex:1;min-height:2px;border-radius:3px 3px 0 0;background:linear-gradient(0deg,var(--am),var(--pink))}
.spark i.z{background:var(--line)}
.wk{display:flex;gap:6px;align-items:flex-end;height:96px;margin:8px 0 4px}
.wc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.7rem;color:var(--dim)}
.wc i{display:block;width:70%;background:linear-gradient(0deg,var(--am),var(--pink));border-radius:5px 5px 0 0;min-height:3px}
.wc i.z{background:var(--line)}.wc .v{font-weight:700;color:var(--txt)}
.heat td,.heat th{text-align:center;padding:6px 2px}.heat td:first-child,.heat th:first-child{text-align:left}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{border:1px dashed #dcc1e6;border-radius:12px;padding:8px;font-size:.85rem;color:#a08fbe;background:#fffafd}
.badge.on{border:1px solid #19c3a0;color:var(--txt);background:#e8fbf5}
.badge b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#fff7fd;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:6px}
.emo button{font-size:1.3rem;padding:0;min-height:44px}.emo button.on{border-color:var(--pink);background:#fff0f9}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600}
.x{background:none;border:0;color:var(--dim);padding:0 8px;min-height:44px;width:auto;flex:none;font-size:1.1rem;box-shadow:none}
.rowl{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}
.hl{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #f0d2ee88}
.hl .e{font-size:1.2rem;flex:none;width:1.6rem;text-align:center}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats div{background:#faf3ff;border-radius:12px;padding:8px;font-size:.85rem}.stats b{display:block;font-size:1.25rem;color:var(--form)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#ffffffee;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(6px)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--dim);font-size:.72rem;padding:8px 2px}
nav button[aria-current=true]{color:var(--pink);font-weight:700}
nav button span{display:block;font-size:1.25rem}
#mission{position:fixed;inset:0;background:linear-gradient(180deg,#fff0fa 0%,#f1ecff 55%,#e6fbff 100%);overflow:auto;z-index:5}
#mission[hidden],#modal[hidden]{display:none}
#modal{position:fixed;inset:0;background:#3b2a6380;z-index:20;display:grid;place-items:center;padding:16px}
.mbox{background:#fff;border:1px solid var(--am);border-radius:18px;padding:18px;max-width:440px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 10px 40px #8a5cf055}
.bigxp{font:700 2.4rem ui-monospace,Consolas,monospace;text-align:center;color:var(--form);margin:6px 0}
.timer{font:700 3rem ui-monospace,Consolas,monospace;text-align:center;color:var(--form);text-shadow:0 0 18px #19c3a044;margin:18px 0}
.first{font-size:1.15rem;padding:14px;border-radius:14px;background:#fff0f9;border:1px solid #ff4fb066}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:var(--txt);border:1px solid var(--am);border-radius:14px;padding:10px 14px;max-width:90vw;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 6px 24px #8a5cf044}
#toast.on{opacity:1;pointer-events:auto}
.warn{background:#ffe9ee;border:1px solid var(--red);border-radius:12px;padding:10px;margin-bottom:14px;font-size:.9rem}
.goal{display:flex;gap:8px;align-items:center;margin:6px 0}.goal.ok{color:var(--form);font-weight:600}
@keyframes float{50%{transform:translateY(-3px)}}.shark{animation:float 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.shark{animation:none}}

.gems{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.gemc{border:1px solid var(--line);border-radius:14px;padding:8px 4px;background:#fffafd;position:relative}
.gem{width:56px;height:66px}
.gemc.lit{border-color:var(--c);box-shadow:0 0 16px var(--c)}
.gemc.lit .gem{animation:shine 2.2s ease-in-out infinite}
@keyframes shine{0%,100%{filter:drop-shadow(0 0 2px var(--c))}50%{filter:drop-shadow(0 0 10px var(--c))}}
.gemc .gn{font-size:.8rem;font-weight:700}.gemc .gs{font-size:.75rem;color:var(--dim)}
.gemc button{min-height:34px;padding:2px 6px;font-size:.78rem;margin-top:4px}
.celeb{position:relative;height:190px;display:grid;place-items:center;overflow:hidden;margin:6px 0;border-radius:16px;background:radial-gradient(circle at 50% 55%,#fff 0,var(--bgc,#f6efff) 100%)}
.celeb .gem{width:96px;height:112px;position:relative;z-index:2;animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
.celeb .gem.ding{animation:ding .8s ease-in-out both}
.celeb .em{font-size:76px;position:relative;z-index:2;animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg)}60%{transform:scale(1.18) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
@keyframes ding{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}35%{transform:rotate(8deg)}55%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}}
.fillr{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1.3s ease-out .2s both}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ring{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid var(--c);opacity:0;animation:ringx 1.6s ease-out 1.1s infinite}
.ring.r2{animation-delay:1.7s}
@keyframes ringx{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.4);opacity:0}}
.en{position:absolute;bottom:14px;width:8px;height:8px;border-radius:50%;background:var(--c);opacity:0;animation:up 2.2s ease-in infinite;box-shadow:0 0 8px var(--c)}
@keyframes up{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-150px) scale(1.2);opacity:0}}
.twk{position:absolute;color:var(--c);font-size:1.3rem;opacity:0;animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.celeb *,.gemc.lit .gem,.pulse,.gb .gi{animation:none!important}.fillr{transform:none}}
.cat.dn{border:2px solid #2ecc71;background:linear-gradient(180deg,#f0fff6,#fff);box-shadow:0 0 14px #2ecc7144}
.catH{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 0;min-height:40px;text-align:left}
.catH h2{margin:0;flex:1}.catH .ar{color:var(--dim)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:middle}
.pulse{animation:pls 2.2s ease-in-out infinite;border:2px solid var(--pink)}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 #ff4fb055}50%{box-shadow:0 0 0 7px #ff4fb000}}
.month .fog{filter:blur(1.5px);opacity:.45;background:linear-gradient(135deg,#e9ddff,#dff6ff)}
.month .hid{opacity:.35;border-style:dashed}
.lock{opacity:.6}
.dh{touch-action:none;cursor:grab;font-size:1.2rem;color:var(--dim);flex:none;width:36px;min-height:44px;display:grid;place-items:center;user-select:none}
.dragging{opacity:.6;position:relative;z-index:5}.dropb{box-shadow:0 -3px 0 0 var(--pink)}
.chart{width:100%;height:auto}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.lg button{padding:4px 10px;min-height:32px;font-size:.8rem;border-radius:999px}
.hm td{text-align:center;padding:6px 2px}.hm td:first-child{text-align:left}
.emb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.emb button{padding:6px 2px;font-size:.78rem;min-height:56px}.emb button.on{border-color:var(--pink);background:#fff0f9}
.adv{border-left:3px solid var(--ice);padding:6px 10px;margin:8px 0;background:#effbff;border-radius:0 10px 10px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 12px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--pink)}.dots i.dn{background:var(--am)}
.big{font-size:1.15rem}
.node{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}.node .nic{font-size:1.2rem;width:1.6rem;text-align:center}
.node.lk{opacity:.55}.node.cur{background:#fff0f9;border-radius:12px;padding:8px;border:1px solid var(--pink)}
.gb{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px;border-radius:14px;background:linear-gradient(90deg,#f1ecff,#ffe9f6);border:1px solid var(--am)}
.gb .gi{font-size:2.2rem;animation:pop 2.4s ease-in-out infinite}
.bar.bg2{height:14px;border-radius:10px}
</style>
</head>
<body>
<main id="app"></main>
<div id="mission" hidden><main id="mbody"></main></div>
<div id="modal" hidden><div class="mbox" id="mcont"></div></div>
<nav>
  <button data-tab="dossier"><span>🧚</span>Главная</button>
  <button data-tab="tasks"><span>📋</span>Задания</button>
  <button data-tab="journal"><span>🗂️</span>Журнал</button>
  <button data-tab="final"><span>🌙</span>Финал</button>
  <button data-tab="more"><span>⚙️</span>Ещё</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
window.__timeOff=()=>0;window.__timeShift=()=>0;
const D={"L": {"full": [["t", "Задача выполнена. Результат записан."], ["t", "Выполнено. Не идеально, но завершено — это ценнее незавершённого идеала."], ["t", "Успех. Статус обновлён."], ["t", "Процесс завершён. Можно переходить к отдыху."], ["t", "Результат зафиксирован. Хорошая работа."], ["t", "Задача закрыта, ресурсы освобождены."], ["m", "Получилось! Я так за тебя рада!"], ["m", "Дело закрыто — и ты можешь собой гордиться."], ["m", "Красиво! Запомни это ощущение, оно твоё."]], "ad_hind": [["t", "Одна помеха повторяется чаще остальных."], ["m", "Эта помеха приходит снова и снова. Может, придумаем для неё чары решимости?"]], "ad_sleep": [["t", "Сон ниже 5 баллов несколько дней подряд. Это стоит обсудить с психологом, а не исправлять в одиночку."], ["m", "Похоже, тебе не хватает отдыха. Расскажи об этом психологу."]], "rankup": [["t", "Звание повышено. Статус обновлён."], ["t", "Заметный прогресс. Отмечено в профиле."], ["t", "Следующий уровень уже доступен."], ["m", "Новое звание! Ты растёшь."]], "start": [["t", "Не нужно ждать, пока появится желание. Запуск процесса не зависит от настроения."], ["t", "Разбей задачу на шаги. Первый шаг — самый маленький."], ["t", "Начни с минимальной версии. Улучшать будешь потом."], ["t", "Первый шаг — это запуск. Остальное выполнится по ходу."], ["t", "Не пытайся предсказать результат. Просто запусти и посмотри, что получится."], ["m", "Начало — самое трудное. Но ты уже здесь, и это уже шаг."], ["m", "Не думай, как всё получится. Сделай один маленький жест."], ["m", "Включи что-нибудь, что любишь, и начни с первого движения."]], "full_quick": [["t", "Время выполнения минимальное. Эффективно."], ["t", "Быстро и без ошибок."], ["m", "Пара минут — и дело сделано. Вот это темп!"]], "dossier_d4": [["t", "Последняя неделя: оптимизация. Не ускоряйся, держи ритм."], ["t", "Месяц почти завершён. Остаётся закрепить результат."]], "unlock_feat": [["t", "Полный функционал открыт: «Засечь момент», советы, тепловая карта."], ["m", "Открылись новые возможности. Заглядывай в «Журнал»."]], "start_hard": [["t", "Задача объёмная. Разделим на подзадачи и начнём с первой."], ["t", "Сложное — это просто много простого. Выбери первый кусок."], ["t", "Большие задачи нельзя выполнить одним действием. Нужно начать с одного шага."], ["m", "Дело тяжёлое, и это честно. Возьми только первый кусочек."]], "dossier_d3": [["t", "Третья неделя: накоплено достаточно данных. Посмотри, что работает лучше всего."], ["t", "Можно добавить свои задачи: система готова."]], "time_fix": [["t", "Запись длиннее обычного. Возможно, таймер не остановили."], ["m", "Кажется, таймер шёл слишком долго. Давай поправим время."]], "tasks_day": [["t", "Ресурсы в норме. Выбери одну задачу и запусти её."], ["t", "Не обязательно оптимизировать всё сразу. Одна задача — уже прогресс."], ["t", "Любое выполненное дело учитывается. Даже самое короткое."], ["m", "День в разгаре. Выбери одно дело, которое отзывается, и просто начни."], ["m", "Не жди идеального настроения. Оно приходит уже по ходу дела."]], "final": [["t", "Итоговый отчёт. Заполни точно: мне нужны данные, а не красота."], ["t", "Анализ результатов начинается с честных ответов."], ["t", "Правильных ответов нет. Есть точные."], ["t", "Заполни не спеша. Спешка вносит ошибки."], ["m", "Заполни честно: твои слова важны, а не красота ответов."], ["m", "Это не экзамен, а твой рассказ о том, как всё было."]], "ad_rest_do": [["t", "День помечен как плохой, но дело выполнено. Нагрузка была повышенной."], ["m", "В тяжёлый день ты всё равно сделала шаг. Это ценно."]], "run": [["t", "Процесс идёт. Показатели в норме."], ["t", "Отвлеклась? Это сбой внимания, не критичный. Возвращайся к задаче."], ["t", "Скорость стабильная. Продолжай в том же режиме."], ["t", "Нужна пауза — сделай. Перегрев системы хуже короткой остановки."], ["t", "Каждое действие — ещё один шаг к завершению."], ["t", "Самая сложная часть — запуск — уже выполнена."], ["m", "Ты уже в деле. Продолжай, я рядом."], ["m", "Идёшь ровно — и этого достаточно. Не торопись."], ["m", "Отвлеклась? Это бывает. Вернуться тоже умение."]], "tasks_evening": [["t", "Заряд к вечеру снижается — это штатно. Выбирай задачу по остаточной энергии."], ["t", "Вечерний режим: низкая нагрузка, высокая аккуратность."], ["t", "Мало сил? Запусти самое лёгкое. Оно тоже в зачёте."], ["m", "Вечер — мягкое время. Одно небольшое дело, и можно выдохнуть."], ["m", "Силы к вечеру убывают, это нормально. Выбери самое лёгкое."]], "crystal_ding": [["t", "Ещё одно дело из этой категории. Кристалл откликается."], ["m", "Звенит ещё громче! Так держать."]], "sos": [["t", "Не получается запустить? Такое бывает. Давай минимальный шаг."], ["t", "Две минуты, одно действие. Остальное решишь сама."], ["t", "Остановись. Определи самое маленькое действие, которое можно выполнить сейчас."], ["t", "Не думай о всей задаче. Думай только о ближайших двух минутах."], ["m", "Не получается начать? Ничего страшного. Выбери самый маленький шаг."], ["m", "Выдохни. Тебе не обязательно хотеть, достаточно попробовать."]], "moment_intro": [["t", "Фиксация момента. Чем точнее запись, тем полезнее анализ прокрастинации."], ["m", "Заметить момент уже большое дело. Расскажи, что было."]], "ad_back_do": [["t", "Дело выполнено в день возвращения. Это самый трудный шаг."], ["m", "Сразу в деле после паузы! Вот это возвращение."]], "sos_go": [["t", "Ноль. Дело начато. Таймер идёт вверх."], ["m", "Всё, ты уже в деле! Дальше только идти."]], "dossier_d1": [["t", "Первая неделя: калибровка. Главное — регулярно заходить."], ["t", "Не нужны идеальные результаты. Нужны данные."]], "sosyes": [["t", "Процесс запущен. Дальше проще."], ["t", "Старт выполнен. Самое сложное позади."], ["t", "Хорошо. Продолжай, пока идёт."], ["m", "Вот и началось! Самое трудное позади."]], "full_long": [["t", "Длительный процесс завершён. Рекомендую воду и паузу."], ["t", "Ты потратила много времени и ресурсов. Заслуженный отдых."], ["m", "Ты так долго держалась! Выпей воды и отдохни. Силы нужно беречь."]], "full_easy": [["t", "Небольшая задача, но в журнале она учтена."], ["t", "Простые задачи складываются в большую статистику."], ["t", "Лёгкий результат — тоже результат."], ["m", "Лёгкая победа тоже победа. Из них складывается ритм."]], "streak": [["t", "Несколько дней подряд — устойчивый паттерн."], ["t", "Серия идёт. Если прервётся — это просто пауза."], ["t", "Повторение формирует привычку."], ["m", "Несколько дней подряд! Ритм становится твоим."]], "unlock_week": [["t", "Тестовая неделя пройдена. Доступ ко всему эксперименту в 30 дней открыт."], ["m", "Ты прошла тестовую неделю! Теперь вся карта твоя."]], "ad_nocrystal": [["t", "Не все кристаллы получили категорию. Назначь её на главной или в «Ещё»."], ["m", "Этот кристалл ещё ждёт свою категорию. Давай назначим!"]], "dir_unlock": [["t", "Чары решимости доступны. Это награда за наблюдательность."], ["m", "Ты заслужила Чары решимости! Самое время выбрать своё заклинание."]], "daily_nosleep": [["t", "Сна не было. Зафиксировано отдельно, в среднее значение не входит."], ["m", "Тяжело, когда не спится. Позаботься о себе сегодня."]], "dossier_d5": [["t", "Срок истёк, но система работает дальше. Продолжай в своём режиме."], ["t", "Всё, что сделано после срока, — дополнительный результат."]], "ad_dip": [["t", "Активность на этой неделе ниже обычной. Возможно, мешает что-то конкретное."], ["m", "Бывает тихая неделя. Давай посмотрим, что её тянуло вниз."]], "ad_back_long": [["t", "Перерыв более недели. Предлагаю не наверстывать, а начать с одного небольшого дела."], ["m", "Ты вернулась, и это самое важное. Давай выберем самое лёгкое дело."]], "ad_back_short": [["t", "Пауза: несколько дней. Данные сохранены, можно продолжать с любого места."], ["m", "С возвращением! Ничего страшного не случилось, начнём с малого."]], "level_up": [["t", "Новый уровень засечки. Открыты дополнительные вопросы."], ["m", "Ты растёшь! Замечать себя получается всё лучше."]], "tasks_night": [["t", "Уже ночь. Рекомендую перейти в режим сна: остальное подождёт."], ["t", "Ночью эффективность падает. Одна короткая задача — и отбой."], ["t", "Сон — обязательное обновление. Остальное завтра."], ["m", "Уже поздно. Если дело подождёт — пусть ждёт. Сон тоже часть магии."], ["m", "Ночью лучше беречь силы. Только если очень коротко."]], "start_study": [["t", "Открой материалы. Сначала просто загрузи информацию, анализ потом."], ["t", "Учёба — это обработка данных частями. Начни с первой части."], ["t", "Не нужно понимать всё сразу. Первая страница — достаточный старт."], ["m", "Учёба. Открой тетрадь — этого достаточно, чтобы двигаться дальше."]], "cap": [["t", "Дневной лимит достигнут. Остальные задачи дадут минимум опыта: отдохни."], ["t", "Перегрузка снижает эффективность."], ["t", "Лимит — защита системы, а не наказание."], ["m", "Сегодня ты потратила много сил. Завтрашней тебе они тоже понадобятся."]], "daily_intro": [["t", "Короткая отметка, десять секунд. Данные нужны, чтобы советы были точными."], ["m", "Всего пара движений ползунком, и день станет понятнее."]], "sosfail": [["t", "Запуск не удался. Это не ошибка, а информация для следующей попытки."], ["t", "Попытка зафиксирована. Это данные, а не провал."], ["t", "Иногда системе нужна перезагрузка. Завтра повторишь."], ["m", "Не вышло — это данные, не вина. Вернёмся позже."]], "crystal_spark": [["t", "Кристалл активирован: дело из его категории выполнено."], ["m", "Кристалл засиял! Слышишь, как он звенит?"]], "ach": [["t", "Достижение разблокировано."], ["t", "Новая отметка в архиве."], ["t", "Значки — приятный бонус, но главное — сами задачи."], ["m", "Ещё одна звёздочка в коллекции!"]], "full_study": [["t", "Учебная задача закрыта. Данные обработаны."], ["t", "Знания накапливаются шагами. Ещё один сделан."], ["t", "Объём материала уменьшился. Хорошо."], ["m", "Страница за страницей — и знания твои."]], "gap": [["t", "С возвращением. Пауза не удалила данные, всё сохранено."], ["t", "Давно не заходила. Можно продолжить с любой точки."], ["t", "Перерыв допустим. Прогресс не обнуляется."], ["m", "Ты вернулась! Это самое важное."], ["m", "Перерыв не обнуляет прогресс. Он сохранён."]], "moment_saved": [["t", "Момент записан. Это данные, а не оценка."], ["m", "Спасибо, что заметила и записала. Это правда непросто."]], "ad_steady": [["t", "Стабильность высокая. Нагрузка в пределах нормы."], ["m", "Ритм звучит ровно, и это красиво!"]], "full_hyg": [["t", "Обслуживание проведено. Системе спокойнее."], ["t", "Это важная процедура, и она выполнена."], ["t", "Состояние улучшено. Запишем."], ["m", "Позаботилась о себе. Это здорово."]], "dir_confirm": [["t", "Чары решимости фиксируются. Изменить их нельзя до окончания срока."], ["m", "Это заклинание-обещание самой себе. Эта формулировка тебе точно подходит?"]], "full_hard": [["t", "Сложная задача выполнена. Это требует восстановления: отдохни."], ["t", "Объёмный процесс завершён успешно. Отличный результат."], ["t", "Высокая нагрузка — и ты справилась. Запишем отдельно."], ["m", "Это было непросто — и ты справилась. Подари себе паузу."]], "dir_cancel": [["t", "Чары отменены как ошибочные. Пауза не включена."], ["m", "Ничего страшного, бывает. Сформулируем заклинание заново."]], "sos_prep": [["t", "Обратный отсчёт запущен. Две минуты на подготовку: найди место, достань всё нужное."], ["m", "Две минуты, чтобы собраться. Вдох, плечи вниз, и мы начинаем."], ["t", "Готовься к началу дела. Через две минуты таймер перейдёт в рабочий режим."]], "dossier_d2": [["t", "Вторая неделя: привычка ещё в разработке. Дай ей время."], ["t", "Стабильность важнее скорости."]], "tasks_morning": [["t", "Система запущена. Первый процесс дня — любое небольшое дело."], ["t", "Утром загрузка минимальная. Хорошее время для одного лёгкого дела."], ["t", "Режим «утро» включён. Начни с одной задачи, остальное подгрузится само."], ["m", "Утро звучит тихо и чисто. Одно маленькое дело — и день уже в твоём ритме."], ["m", "Доброе утро! Не нужно всё сразу. Выбери то, к чему тянется рука."]], "start_easy": [["t", "Лёгкая задача. Выполнится за пару минут."], ["t", "Минимальная нагрузка. Запускай."], ["t", "Простое дело — хорошая проверка: система работает."], ["m", "Лёгкое дело — отличная разминка. Сделаешь быстро!"]], "rest": [["t", "Плохой день: режим энергосбережения. Отдыхай."], ["t", "Сегодня задач нет. Восстановление — тоже процесс."], ["t", "Перезагрузка системы займёт ночь. Завтра будет новая сессия."], ["m", "Плохой день — тоже день. Отдыхай, это не слабость."], ["m", "Ты отметила плохой день — это забота о себе."]], "start_hyg": [["t", "Гигиена — это обслуживание системы. Регулярность важнее длительности."], ["t", "Первый шаг — дойти до места. Остальное — стандартная процедура."], ["t", "Поставь трек, чтобы время шло быстрее. Процедура короткая."], ["m", "Забота о себе — тоже дело. Сделай её приятной."]], "part": [["t", "Задача выполнена частично. Данные сохранены, остальное можно продолжить позже."], ["t", "Остановка — тоже допустимое решение. Статус: приостановлено."], ["t", "Половина — это уже больше нуля. Запишем."], ["t", "Незавершённое не удаляется, оно ждёт продолжения."], ["m", "Часть тоже считается. Остальное подождёт."], ["m", "Половина пути — всё равно путь."]]}, "BRIEF": {"1": [["m", "Первая неделя: пробуем. Приходи и смотри, как всё устроено."], ["t", "Первая неделя: калибровка. Нужны не идеальные результаты, а регулярные данные."]], "2": [["m", "Вторая неделя: втягиваемся. Закрепляй то, что получилось."], ["t", "Вторая неделя: стабилизация. Повторяй рабочие шаги."]], "3": [["m", "Третья неделя: смотрим, что идёт легче всего, и добавляем своё."], ["t", "Третья неделя: анализ. Журнал уже показывает, что работает."]], "4": [["m", "Четвёртая неделя: финишная прямая. Держи свой темп."], ["t", "Четвёртая неделя: итоговая. Осталось не снижать скорость."]], "5": [["m", "Сезон завершён! Осталась итоговая запись."], ["t", "Срок вышел. Система ждёт итоговую запись."]]}, "ENDS": {"0": ["Сезон продлён", [["t", "Срок сезона истёк, порог опыта не набран. Это допустимый исход."], ["m", "Это не провал, а продолжение. Отсюда и стартуем."], ["t", "Сезон продлён. Все записи сохранены."]]], "1": ["Сезон закрыт", [["t", "Порог пройден. Сезон закрыт успешно."], ["m", "Сосуд полон! Мы это сделали — точнее, ты сделала."], ["t", "Результат подтверждён данными: дела выполнены, опыт набран."], ["m", "Знаешь, что круче всего? Ты наполнила его сама."], ["t", "Дальнейшие действия — на твоё усмотрение."]]], "2": ["Доступ расширен", [["t", "Сезон закрыт, и шире, чем требовалось: ты работала в разных направлениях."], ["m", "Смотри, что в твоём списке: {cats}. Столько всего за один сезон!"], ["t", "Доступ расширен: теперь ты сама решаешь, где и когда работать."], ["m", "Я же говорила, что получится!"], ["t", "Отметка в профиле: «Умеет распределять ресурсы»."]]], "3": ["Свой сезон", [["t", "Сезон закрыт, доступ расширен. И ещё: ты делала это регулярно."], ["m", "Не меньше половины месяца в деле — это не случайность."], ["t", "Такой режим не требует контроля. Расписание теперь составляешь ты."], ["m", "Так что мы с Текной почти без работы! Пойду порепетирую."], ["t", "Феечка передаётся тебе. Продолжай по своему алгоритму."]]]}};

function xpMap(){const m={},w={},seen={},first={},ds={};WHY=w;
 [...S.logs].sort((a,b)=>a.ts-b.ts).forEach(l=>{const d=dayKey(l.ts);let x;const notes=[];
  if(l.type==='rest'){x=first[d+'r']?0:3;first[d+'r']=1;if(!x)notes.push('режим восстановления за день уже засчитан')}
  else{x=LV[l.lvl].xp;if(!l.done){x=Math.ceil(x/2);notes.push('частично — половина опыта')}
   const k=d+'|'+(l.task||l.tname);seen[k]=(seen[k]||0)+1;
   if(seen[k]===2){x=Math.ceil(x/2);notes.push('повтор того же дела за день — половина')}else if(seen[k]>2){x=Math.min(x,2);notes.push('то же дело больше двух раз за день — по 2 XP')}
   if(!first[d]){x+=3;first[d]=1;notes.push('+3 за первое дело дня')}
   const room=Math.max(0,DAYCAP-(ds[d]||0));
   if(x>room){const over=x-room;x=room+Math.max(room===0?1:0,Math.round(over*OVERRATE));notes.push('дневной лимит '+DAYCAP+' XP набран: сверх него даётся только 10% опыта (минимум 1)')}
   ds[d]=(ds[d]||0)+x}
  m[l.id]=x;w[l.id]=notes.join('; ')});return m}

 const x=xpOf(l),why=WHY[l.id]||'',td=S.logs.filter(z=>dayKey(z.ts)===dayKey(l.ts)).length;

function history(){

  ${L.map(l=>l.type==='rest'?`<div class="hl"><span class="e">🌙</span><span>Режим восстановления</span></div>`:`<div class="hl"><span class="e">${esc((task(l.task)||{}).icon||LV[l.lvl].e)}</span><span><b>${esc(l.tname)}</b> <span class="hint">${esc(l.cname)} · ${LV[l.lvl].n}${l.done?'':' · частично'}</span><br><span class="hint">${new Date(l.ts).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})} · ${l.min||0} мин · +${xpOf(l)} XP${l.mood0!=null?' · настроение до: '+l.mood0+', энергия: '+l.en0:''}${l.after!=null?' · настроение после: '+l.after:''}${l.fat1!=null?' · усталость: '+l.fat1:''}</span>${l.note?`<br><span class="hint">📝 ${esc(l.note)}</span>`:''}</span></div>`).join('')}
  ${(sosBy[k]||[]).map(x=>`<div class="hl"><span class="e">🆘</span><span>«Не могу начать»: ${x.started?'получилось начать':'в этот раз не вышло'}</span></div>`).join('')}
  ${(achBy[k]||[]).map(a=>`<div class="hl"><span class="e">🏆</span><span><b>${esc(a.n)}</b> <span class="hint">+${a.xp} XP</span></span></div>`).join('')}</div>`}).join('');
 return spark+cards}

/* ===== Динамика по направлениям ===== */
const weekOf=ts=>Math.floor((dayOf(ts)-1)/7)+1;
function weekRange(){const cur=Math.max(1,weekOf(Date.now())),end=Math.max(4,cur),start=Math.max(1,end-7);return Array.from({length:end-start+1},(_,i)=>start+i)}
const avgOf=(L,k)=>{const v=L.map(l=>l[k]).filter(x=>x!=null&&x!==''&&!isNaN(x));return v.length?avg(v):null};
const f1=v=>v==null?'—':v.toFixed(1);
function trendText(vals){const nn=vals.filter(v=>v!=null);if(nn.length<2)return'пока мало данных';const a=nn[nn.length-2],b=nn[nn.length-1],d=b-a;return Math.abs(d)<0.5?'→ без заметных изменений':(d>0?'↑ +':'↓ ')+d.toFixed(1)+' к предыдущей неделе с данными'}
function catData(){const ids=[];S.cats.forEach(c=>ids.push(c.id));real().forEach(l=>{if(!ids.includes(l.cat))ids.push(l.cat)});
 return ids.map(id=>({id,name:(cat(id)||{name:(real().find(l=>l.cat===id)||{}).cname||'—'}).name,icon:(cat(id)||{icon:'📌'}).icon}))}
function dynamics(){
 if(!real().length)return'<div class="card">Динамика появится, когда будут записи о делах.</div>';
 const W=weekRange(),cd=catData();
 const by=(c,w)=>real().filter(l=>l.cat===c&&weekOf(l.ts)===w);
 const mx=Math.max(1,...cd.flatMap(c=>W.map(w=>by(c.id,w).length)));
 const heat=`<div class="card" style="overflow-x:auto"><h2>Сравнение направлений</h2><table class="heat"><tr><th>Направление</th>${W.map(w=>`<th>Н${w}</th>`).join('')}</tr>${cd.map(c=>`<tr><td>${esc(c.icon)} ${esc(c.name)}</td>${W.map(w=>{const n=by(c.id,w).length;return`<td style="background:rgba(138,92,240,${n?(.12+.5*n/mx).toFixed(2):0})">${n||'·'}</td>`}).join('')}</tr>`).join('')}</table><p class="hint">Число дел по неделям сезона. Н1 — первая неделя после старта.</p></div>`;
 const cards=cd.map(c=>{const all=real().filter(l=>l.cat===c.id);
  if(!all.length)return`<div class="card"><h2>${esc(c.icon)} ${esc(c.name)}</h2><p class="hint">Пока нет записей в этом направлении.</p></div>`;
  const cnt=W.map(w=>by(c.id,w).length),mxx=Math.max(1,...cnt);
  const mins=W.map(w=>by(c.id,w).reduce((s,l)=>s+(l.min||0),0));
  const want=W.map(w=>avgOf(by(c.id,w),'mood0')),res=W.map(w=>avgOf(by(c.id,w),'en0')),aft=W.map(w=>avgOf(by(c.id,w),'after'));
  const bars=`<div class="wk">${W.map((w,i)=>`<div class="wc"><span class="v">${cnt[i]||''}</span><i class="${cnt[i]?'':'z'}" style="height:${cnt[i]?Math.max(10,Math.round(cnt[i]/mxx*70)):3}px"></i><span>Н${w}</span></div>`).join('')}</div>`;
  const row=(label,arr,fn)=>`<tr><th>${label}</th>${arr.map(v=>`<td>${fn(v)}</td>`).join('')}</tr>`;
  const tb=`<table class="heat"><tr><th></th>${W.map(w=>`<th>Н${w}</th>`).join('')}</tr>${row('Минут',mins,v=>v||'·')}${row('Настроение до',want,f1)}${row('Энергия до',res,f1)}${row('Настроение после',aft,f1)}</table>`;
  return`<div class="card"><h2>${esc(c.icon)} ${esc(c.name)}</h2><p class="hint">Всего: ${all.length} дел, ${all.reduce((s,l)=>s+(l.min||0),0)} мин, ${all.reduce((s,l)=>s+xpOf(l),0)} XP</p>${bars}<div style="overflow-x:auto">${tb}</div>
  <p class="hint">Настроение до: ${trendText(want)}</p><p class="hint">Энергия до: ${trendText(res)}</p><p class="hint">Настроение: ${trendText(aft)}</p></div>`}).join('');
 return heat+cards+'<p class="hint">«·» и «—» значат, что записей не было. Одна неделя — мало данных, смотри на несколько недель подряд.</p>'}
function dynLines(){const W=weekRange(),cd=catData();const r=['','ДИНАМИКА ПО НАПРАВЛЕНИЯМ (недели сезона):'];
 cd.forEach(c=>{const parts=W.map(w=>{const L=real().filter(l=>l.cat===c.id&&weekOf(l.ts)===w);if(!L.length)return`Н${w}: —`;return`Н${w}: ${L.length} дел, ${L.reduce((s,l)=>s+(l.min||0),0)} мин, настроение до ${f1(avgOf(L,'mood0'))}, энергия до ${f1(avgOf(L,'en0'))}, настроение ${f1(avgOf(L,'after'))}`});r.push(`• ${c.name}: `+parts.join(' | '))});return r}

 ask(ts.length?`Удалить категорию «${c.name}» вместе с делами (${ts.length})? Записи в журнале сохранятся. Всё можно вернуть из корзины.`:`Удалить категорию «${c.name}»? Её можно будет вернуть из корзины.`,'Удалить',()=>{
  S.trash.push({id:uid(),kind:'cat',ts:Date.now(),data:{cat:c,tasks:ts}});S.tasks=S.tasks.filter(t=>t.cat!==id);S.cats=S.cats.filter(x=>x.id!==id);save();toast('Удалено. Вернуть можно в корзине.')},true)}
function delTask(id){const t=task(id);ask(`Удалить дело «${t.name}» из списка? Записи в журнале сохранятся. Дело можно вернуть из корзины.`,'Удалить',()=>{
 S.trash.push({id:uid(),kind:'task',ts:Date.now(),data:t});S.tasks=S.tasks.filter(x=>x.id!==id);save();toast('Удалено. Вернуть можно в корзине.')},true)}
function restore(id){const t=S.trash.find(x=>x.id===id);if(!t)return;
 if(t.kind==='log')S.logs.push(t.data);
 if(t.kind==='diary')S.diary.push(t.data);
 if(t.kind==='cat'){if(!cat(t.data.cat.id))S.cats.push(t.data.cat);t.data.tasks.forEach(x=>{if(!task(x.id))S.tasks.push(x)})}
 if(t.kind==='task'){if(!cat(t.data.cat))S.cats.push({id:t.data.cat,name:'Восстановленная категория',icon:'📌'});if(!task(t.data.id))S.tasks.push(t.data)}
 S.trash=S.trash.filter(x=>x.id!==id);save();toast('Возвращено')}
function purge(id){ask('Удалить навсегда? Вернуть будет нельзя.','Удалить навсегда',()=>{S.trash=S.trash.filter(x=>x.id!==id);save()},true)}

function logLine(l){const t=new Date(l.ts).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
 if(l.type==='rest')return`• ${t} — режим восстановления.`;
 return`• ${t} — [${l.cname}] ${l.tname} (${LV[l.lvl].n}), ${l.min||0} мин.${l.want!=null?' Хотелось начать (до): '+l.want+'/10.':''}${l.resist!=null?' Не хотелось начинать (после): '+l.resist+'/10.':''}${l.after!=null?' Настроение после: '+l.after+'.':''} ${l.done?'Полностью':'Частично'}.${l.quick?' (запись постфактум)':''}${l.first?' Первый шаг: '+l.first+'.':''}${l.lecture?' Фон: '+l.lecture+'.':''}${(l.intr||[]).length?' Помехи: '+l.intr.join('; ')+'.':''}${l.note?' '+l.note:''}`}
function dayLines(logs,base){const by={};logs.forEach(l=>(by[dayKey(l.ts)]??=[]).push(l));const r=[];
 Object.keys(by).sort().forEach(k=>{r.push('',`ДЕНЬ ${Math.round((new Date(k)-new Date(base))/864e5)+1} — ${ruDate(k)} (записей: ${by[k].length})`);by[k].sort((a,b)=>a.ts-b.ts).forEach(l=>r.push(logLine(l)))});return r}
function reportBase(){
 const s=stats(),E=S.end,r=[`ДНЕВНИЧОК — «Дела без прокрастинации»`,`Имя: ${S.name||'—'}`,''];
 if(S.start)r.push(`Старт: ${ruDate(S.start.date)}. Лёгкость скучных дел: ${S.start.ease}/10.${S.start.note?' '+S.start.note:''}`);
 r.push(...dayLines(S.logs,baseDate()));
 if(s.n)r.push('',`ИТОГО: ${s.n} дел за ${s.days} дн. Доведено до конца: ${s.full}%. Всего ${s.min} мин.${s.wntN?' Среднее настроение до дела: '+s.wnt.toFixed(1)+'/10.':''}${s.resN?' Средняя энергия до дела: '+s.res.toFixed(1)+'/10.':''}${s.aftN?' Среднее настроение после: '+s.aft.toFixed(1)+'.':''}`);
 if(real().length)r.push(...dynLines());
 const sosN=S.sos.length,sosY=S.sos.filter(x=>x.started).length;if(sosN)r.push('',`Кнопка «не могу начать»: ${sosN} раз(а), после неё начала: ${sosY}.`);
 if(S.lvlHist.length)r.push('','СМЕНЫ СЛОЖНОСТИ:',...S.lvlHist.map(h=>`• ${ruDate(dayKey(h.ts))} — ${h.tname}: ${LV[h.from].n} → ${LV[h.to].n}`));
 const got=ACH.filter(a=>S.ach[a.id]);if(got.length)r.push('','ДОСТИЖЕНИЯ: '+got.map(a=>a.n).join(', '));
 const dr=[...S.diary].filter(d=>d.share).sort((a,b)=>a.ts-b.ts);if(dr.length)r.push('','ДНЕВНИК (только записи, включённые в отчёт):',...dr.map(d=>`• ${fmt(d.ts)} — ${d.text.replace(/\n+/g,' ')}`));
 if(E&&S.start)r.push('','ФИНАЛ:',`Лёгкость скучных дел: ${S.start.ease} → ${E.ease}/10`,`Настроение в финале: ${E.now??'—'}/10`,`Мысли об эксперименте: ${E.thoughts||'—'}`,`Помогало/мешало: ${E.note||'—'}`,`Заметки: ${E.extra||'—'}`);
 return r.join('\n');
}
function csv(){const H=['дата','время','день_сезона','неделя_сезона','тип','категория','дело','сложность','минуты','хочется_начать_до_1_10','не_хотелось_начинать_после_1_10','настроение_после','выполнено','помехи','первый_шаг','фон','заметка','запись_постфактум','xp'];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const tm=l=>new Date(l.ts).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
 const rows=[...S.logs].sort((a,b)=>a.ts-b.ts).map(l=>[dayKey(l.ts),tm(l),dayOf(l.ts),weekOf(l.ts),l.type||'task',l.cname,l.tname,l.lvl?LV[l.lvl].n:'',l.min||0,l.want??'',l.resist??'',l.after??'',l.done?1:0,(l.intr||[]).join(' | '),l.first,l.lecture,l.note,l.quick?1:0,xpOf(l)].map(q).join(';'));
 return'\uFEFF'+[H.map(q).join(';'),...rows].join('\r\n')}

function dl(n,t,type){
 try{const blob=new Blob([t],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=n;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{try{a.remove();URL.revokeObjectURL(url)}catch(e){}},60000);return true}
 catch(e){try{const a=document.createElement('a');a.href='data:'+type+','+encodeURIComponent(t);a.download=n;a.style.display='none';document.body.appendChild(a);a.click();a.remove();return true}catch(e2){return false}}}
function showExport(name,text,ok){modal(`<h2>${esc(name)}</h2><p class="hint">${ok?'Скачивание запущено. Проверь «Загрузки».':'Скачать файл не получилось.'} Если файла нет — скопируй текст ниже и сохрани его в заметки или отправь сообщением.</p><textarea id="xt" readonly style="min-height:150px;font-size:.78rem">${esc(text)}</textarea><button class="pri" onclick="copyExport()">Скопировать текст</button><button class="ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Закрыть</button>`)}

function exp(kind){XPM=xpMap();const d=dayKey(Date.now());

 if(kind==='csv'){n='feechka-'+d+'.csv';t=csv();type='text/csv;charset=utf-8'}
 if(kind==='txt'){n='otchet-'+d+'.txt';t=report();type='text/plain;charset=utf-8'}

function loadFrom(txt){let o;try{o=JSON.parse(txt);if(!o||!Array.isArray(o.logs)||o.v!==1)throw 0}catch(e){toast('Не получилось прочитать копию: нужен JSON из «Феечки»');return}
 ask('Заменить текущие данные ('+S.logs.length+' записей) данными из копии ('+o.logs.length+')?','Заменить',()=>{S=fill(o);save();toast('Данные загружены')},true)}

function adaptKey(){if(!S.start||!S.logs.length)return null;const n=dayN(),sl=sinceLast(),dd=days(),td=dd.has(dayKey(Date.now())),d=sortedDays();
 if(!td&&sl>=7)return'ad_back_long';if(!td&&sl>=3)return'ad_back_short';
 if(td&&d.length>=2&&gapDays(d[d.length-2],d[d.length-1])>=3)return'ad_back_do';
 const s3=Object.keys(S.daily).sort().map(k=>S.daily[k]).filter(x=>x.sleep!=null).slice(-3);
 if(s3.length>=3&&s3.every(x=>x.sleep<5))return'ad_sleep';
 if(n>=2&&S.cr.some(c=>!c))return'ad_nocrystal';
 const wk=[...Array(7)].filter((_,i)=>dd.has(dayKey(Date.now()-i*864e5))).length;
 if(n>=8&&wk<=1)return'ad_dip';if(wk>=6)return'ad_steady';
 const h=allHind()[0];if(h&&h[1]>=3&&unlocked())return'ad_hind';return null}

let DR=null;
function dragInit(){document.querySelectorAll('[data-drag]').forEach(h=>{h.onpointerdown=e=>{const item=h.closest('[data-item]');if(!item)return;e.preventDefault();try{h.setPointerCapture(e.pointerId)}catch(_){}
  DR={item,list:item.parentElement,type:h.dataset.drag,y0:e.clientY,over:null};item.classList.add('dragging');
  h.onpointermove=ev=>{if(!DR)return;item.style.transform=`translateY(${ev.clientY-DR.y0}px)`;let tgt=null;const sib=[...DR.list.children].filter(x=>x!==item&&x.hasAttribute('data-item'));
   for(const s of sib){const r=s.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){tgt=s;break}}
   sib.forEach(s=>s.classList.remove('dropb'));if(tgt)tgt.classList.add('dropb');DR.over=tgt;
   if(ev.clientY<90)scrollBy(0,-10);else if(ev.clientY>innerHeight-110)scrollBy(0,10)};
  h.onpointerup=h.onpointercancel=()=>{if(!DR)return;const d=DR;DR=null;h.onpointermove=h.onpointerup=h.onpointercancel=null;d.item.style.transform='';d.item.classList.remove('dragging');
   const ids=[...d.list.children].filter(x=>x.hasAttribute('data-item')&&x!==d.item).map(x=>x.dataset.id);const at=d.over?ids.indexOf(d.over.dataset.id):ids.length;ids.splice(at,0,d.item.dataset.id);applyOrder(d.type,ids,d.list.dataset.cat)}}})}

 else{const idx=[],items=[];S.tasks.forEach((t,i)=>{if(t.cat===catId){idx.push(i);items.push(t)}});const ord=ids.map(id=>items.find(t=>t.id===id)).filter(Boolean);idx.forEach((p,k)=>S.tasks[p]=ord[k])}

function setCatCrySel(id,v){v=+v;S.cr=S.cr.map(c=>c===id?'':c);if(v>=0)S.cr[v]=id;save()}
function more(){
 const cs=S.cats.map(c=>{const ts=S.tasks.filter(t=>t.cat===c.id);return`<div class="card" data-item data-id="${c.id}"><div class="row" style="flex-wrap:nowrap"><span class="dh" data-drag="cat" title="Перетащить категорию" aria-label="Перетащить категорию">⋮⋮</span><h2 style="flex:3;margin:0">${esc(c.icon)} ${esc(c.name)}</h2><button class="x" onclick="moveItem('cat','${c.id}',-1)" aria-label="Выше">↑</button><button class="x" onclick="moveItem('cat','${c.id}',1)" aria-label="Ниже">↓</button><button class="x" onclick="renameCat('${c.id}')" aria-label="Переименовать категорию">✎</button><button class="x" onclick="delCat('${c.id}')" aria-label="Удалить категорию">🗑</button></div>
 <div class="row" style="margin:6px 0">${crSel(c.id)}</div>
 <div data-cat="${c.id}">${ts.map(t=>`<div class="rowl" data-item data-id="${t.id}"><span class="dh" data-drag="task" title="Перетащить дело" aria-label="Перетащить дело">⋮⋮</span><span style="flex:1">${esc(t.icon||LV[t.lvl].e)} ${esc(t.name)} <span class="hint">${LV[t.lvl].n}</span></span><span style="white-space:nowrap"><button class="x" onclick="moveItem('task','${t.id}',-1,'${c.id}')" aria-label="Выше">↑</button><button class="x" onclick="moveItem('task','${t.id}',1,'${c.id}')" aria-label="Ниже">↓</button><button class="x" onclick="openLvl('${t.id}')" aria-label="Изменить дело">⇅</button><button class="x" onclick="delTask('${t.id}')" aria-label="Удалить дело">🗑</button></span></div>`).join('')||'<p class="hint">Пока нет дел</p>'}</div></div>`}).join('');
 const hd=S.hind.map((h,i)=>`<div class="rowl"><span>${esc(h)}</span><span><button class="x" onclick="renameHind(${i})" aria-label="Изменить">✎</button><button class="x" onclick="delHind(${i})" aria-label="Удалить">🗑</button></span></div>`).join('')||'<p class="hint">Список пуст.</p>';
 const lg=S.logs.filter(l=>l.type!=='rest').sort((a,b)=>b.min-a.min).slice(0,10);
 const tf=`<div class="card"><p class="hint">Если забыла нажать «Стоп» и таймер набежал лишнего, поправь реальное время. Показаны самые длинные записи; ⚠️ — длиннее ${LONG_MIN/60} часов.</p>${lg.map(l=>`<div class="rowl"><span>${l.min>=LONG_MIN&&!l.fixed?'⚠️ ':''}${esc(l.tname)}<br><span class="hint">${fmt(l.ts)} · <b>${l.min}</b> мин${l.fixed?' · исправлено (было '+l.minOrig+')':''}</span></span><button onclick="openFix(${l.id})">Исправить</button></div>`).join('')||'<p class="hint">Записей пока нет.</p>'}</div>`;
 const cln=S.lines.map((x,i)=>`<div class="rowl"><span><b>${who(x.who)}</b> · <span class="hint">${esc(CTXN[x.ctx]||x.ctx)}</span><br>${esc(x.text)}</span><button class="x" onclick="delLine(${i})" aria-label="Удалить реплику">🗑</button></div>`).join('')||'<p class="hint">Своих реплик пока нет.</p>';
 const KN={log:'Запись о деле',task:'Дело',cat:'Категория',diary:'Запись дневника'};
 const tr=[...S.trash].sort((a,b)=>b.ts-a.ts).map(t=>{const d=t.data;const nm=t.kind==='log'?(d.tname||'—')+' · '+fmt(d.ts):t.kind==='task'?d.name:t.kind==='cat'?d.cat.name+' ('+d.tasks.length+' дел)':d.text.slice(0,40);return`<div class="rowl"><span><span class="hint">${KN[t.kind]}</span><br>${esc(nm)}</span><span><button onclick="restore('${t.id}')">Вернуть</button><button class="x" onclick="purge('${t.id}')" aria-label="Удалить навсегда">✕</button></span></div>`}).join('')||'<p class="hint">Корзина пуста.</p>';
 const sr=`<div class="card"><label for="sr">Вопрос про сон обновляется каждый день в</label><select id="sr" onchange="S.sleepReset=+this.value;save()">${[...Array(13).keys()].map(h=>`<option value="${h}" ${sleepResetH()===h?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}</select><p class="hint">По умолчанию 05:00. До этого часа вопрос про сон ещё относится к прошлому дню. Вопрос про питание всегда за вчера.</p></div>`;
 return`<h1>Ещё</h1>
 <h2>Категории и дела</h2><p class="hint">Перетаскивай за ⋮⋮ (или нажимай ↑ ↓), чтобы менять порядок: сверху самое приоритетное. ⇅ — название, сложность, первый шаг. Выпадающий список — привязка категории к кристаллу.</p>${cs}<div class="row"><button onclick="openNewCat()">+ Категория</button><button onclick="openNewTask('${S.cats[0]?S.cats[0].id:''}')">+ Дело</button></div>
 <h2 style="margin-top:22px">Что мешает делам</h2><div class="card">${hd}<label for="nh">Добавить свой вариант</label><input type="text" id="nh" maxlength="80"><button class="pri" onclick="addHind()">Добавить</button></div>
 <h2 style="margin-top:22px">Неверно внесённое время</h2>${tf}
 <h2 style="margin-top:22px">Настройки</h2>${sr}
 <h2 style="margin-top:22px">Реплики</h2><div class="card"><h3>Добавить свою реплику</h3><label for="lc">Когда звучит</label><select id="lc">${Object.keys(CTXN).map(k=>`<option value="${k}">${CTXN[k]}</option>`).join('')}</select><label for="lw">Кто говорит</label><select id="lw"><option value="m">Фея Муза</option><option value="t">Фея Текна</option></select><label for="lt">Текст</label><input type="text" id="lt" maxlength="200"><button class="pri" onclick="addLine()">Добавить</button><h3 style="margin-top:16px">Твои реплики</h3>${cln}</div>
 <h2 style="margin-top:22px">Корзина</h2><div class="card">${tr}</div>
 <h2 style="margin-top:22px">Данные</h2><div class="card"><p class="hint">Данные хранятся только на этом устройстве, в этом приложении. Скачай копию, особенно перед сменой телефона, очисткой данных сайтов или удалением значка.${S.lastBackup?' Последняя копия: '+fmt(S.lastBackup)+'.':''}</p>
 <div class="row"><button onclick="exp('json')">⬇ Копия (JSON)</button><button onclick="exp('csv')">⬇ Таблица (CSV)</button><button onclick="exp('txt')">⬇ Отчёт (TXT)</button></div>
 <p class="hint">Если файл не скачался, откроется окно с текстом: его можно скопировать и сохранить в заметки или отправить сообщением.</p>
 <label for="imp">Загрузить копию (JSON)</label><input type="file" id="imp" accept=".json,application/json" onchange="imp(this)">
 <label for="impt">Или вставь текст копии</label><textarea id="impt" placeholder="Вставь сюда содержимое JSON-копии"></textarea><button style="width:100%;margin-top:8px" onclick="impText()">Загрузить из текста</button>
 <button class="danger" style="width:100%;margin-top:16px" onclick="resetAll()">Стереть все данные</button></div>`}
function journal(){
 const tabs=[['sum','Сводка'],['logs','Дела'],['hist','История'],['dyn','Направления'],['diary','Дневник']];
 const sw=`<div class="row" style="margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto">${tabs.map(t=>`<button style="flex:none" class="${jtab===t[0]?'sel':''}" onclick="jtab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
 return`<h1>Журнал</h1>${sw}${({sum:summary,logs:logsView,hist:history,dyn:dynamics,diary})[jtab]()}`}
function report(){const r=[reportBase()],ds=Object.keys(S.daily).sort();
 if(ds.length)r.push('','УТРЕННЯЯ ОТМЕТКА (сон / питание, 1–10):',...ds.map(k=>{const e=S.daily[k];return`• ${ruDate(k)} — сон: ${e.nosleep?'не спала':(e.sleep??'—')}, питание: ${e.food??'—'}`}));
 if(S.moments.length)r.push('','МОМЕНТЫ ПРОКРАСТИНАЦИИ:',...S.moments.map(x=>`• ${fmt(x.ts)}${x.late?' (задним числом: '+x.when+')':''} — [${x.cname}] ${x.tname}. Помехи: ${(x.hind||[]).join('; ')||'—'}. Занималась: ${x.doing||'—'}. Чувство: ${x.emoName}${x.int?' ('+x.int+'/5)':''}.`));
 if(S.dirs.length)r.push('','ЧАРЫ РЕШИМОСТИ (директивы):',...S.dirs.map(d=>`• ${fmt(d.ts)} — когда ${d.ifT}, я ${d.thenT}. ${d.status==='cancelled'?'Отменены (ошибка).':d.status==='stopped'?'Завершены досрочно.':d.status==='done'?'Итог: '+RES[d.result]+'.':'Действуют.'}`));
 const fx_=S.logs.filter(l=>l.fixed);if(fx_.length)r.push('','ИСПРАВЛЕННОЕ ВРЕМЯ:',...fx_.map(l=>`• ${fmt(l.ts)} ${l.tname}: ${l.minOrig} → ${l.min} мин`));
 const ins=insights();if(ins.length)r.push('','НАБЛЮДЕНИЯ ПРИЛОЖЕНИЯ (по правилам, не диагноз):',...ins.map(t=>'• '+t));
 return r.join('\n')}
function render(){XPM=xpMap();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));
 const w=storageOk?'':'<div class="warn">⚠️ Этот браузер не сохраняет данные. Открой приложение с главного экрана телефона (значок), а не из вкладки.</div>';
 document.getElementById('app').innerHTML=w+({dossier,tasks,journal,final,more})[tab]();renderMission();if(tab==='more')dragInit()}

function achBlock(list){return list.length?`<h3>🏆 ${list.length>1?'Достижения':'Достижение'}</h3>${list.map(a=>`<p><b>${a.ic||''} ${esc(a.n)}</b> · +${a.xp} XP<br><span class="hint">${esc(a.d)}</span></p>`).join('')}`:''}
function showAch(list){modal(`<h2>Новое достижение</h2>${achBlock(list)}${qt(lineFrom('ach'))}<button class="pri" onclick="closeModal()">Ок</button>`)}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

document.getElementById('toast').onclick=()=>document.getElementById('toast').classList.remove('on');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});
render();
</script>
</body>
</html>
